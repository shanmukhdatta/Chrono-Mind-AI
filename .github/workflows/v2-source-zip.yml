name: V2 Source ZIP
on:
  push:
    branches: [v2/consolidated-readme-audit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create source archive from tracked files only
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=ChronoMind-AI-V2/ \
            --output=dist/ChronoMind-AI-V2-source.zip HEAD
          unzip -t dist/ChronoMind-AI-V2-source.zip | tail -n 2
          sha256sum dist/ChronoMind-AI-V2-source.zip > dist/SHA256SUMS.txt
      - name: Publish source ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChronoMind-AI-V2-source
          path: |
            dist/ChronoMind-AI-V2-source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
