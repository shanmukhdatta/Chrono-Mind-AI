name: ChronoMind V2 CI

on:
  pull_request:
    branches: [main, 'v2/**']
  push:
    branches: ['v2/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chronomind-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Reject tracked generated artifacts and private configuration
        run: |
          python - <<'PY'
          import subprocess
          import sys

          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          disallowed = []
          for path in filter(None, paths):
              parts = path.lower().split("/")
              filename = parts[-1]
              if (
                  any(part in {"__pycache__", "node_modules", ".venv"} for part in parts)
                  or filename.endswith((".pyc", ".pyo"))
                  or filename in {".env", ".env.local", ".env.production", "serviceaccountkey.json"}
                  or (filename.startswith("service-account") and filename.endswith(".json"))
              ):
                  disallowed.append(path)
          if disallowed:
              print("Generated artifacts or private config found in Git:", file=sys.stderr)
              print("\n".join(disallowed), file=sys.stderr)
              sys.exit(1)
          print("Repository hygiene check passed")
          PY
      - name: Compile backend sources
        run: python -m compileall -q backend
      - name: Run backend regressions and API smoke tests
        working-directory: backend
        env:
          CHRONOMIND_DISABLE_LEGACY_SCHEDULER: '1'
        run: python -m pytest -q
      - name: Verify 120 deterministic scheduling scenarios
        working-directory: backend
        run: python -m evals.run

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run deterministic frontend regression tests
        working-directory: frontend
        env:
          TZ: Asia/Kolkata
        run: npm test
      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build
