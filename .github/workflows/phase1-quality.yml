name: Phase 1 Quality Gates

on:
  pull_request:
    branches: [main, v2/phase0-safety]
  push:
    branches: [v2/phase1-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Compile backend sources
        run: python -m compileall -q backend
      - name: Run backend regressions and API smoke tests
        working-directory: backend
        env:
          CHRONOMIND_DISABLE_LEGACY_SCHEDULER: '1'
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run deterministic frontend regression tests
        working-directory: frontend
        env:
          TZ: Asia/Kolkata
        run: npm test
      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build
