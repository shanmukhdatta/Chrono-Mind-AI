name: ChronoMind V2 CI

on:
  pull_request:
    branches: [main, 'v2/**']
  push:
    branches: ['v2/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chronomind-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Reject tracked generated artifacts and private configuration
        run: |
          python - <<'PY'
          import subprocess
          import sys

          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          disallowed = []
          for path in filter(None, paths):
              parts = path.lower().split("/")
              filename = parts[-1]
              if (
                  any(part in {"__pycache__", "node_modules", ".venv"} for part in parts)
                  or filename.endswith((".pyc", ".pyo"))
                  or filename in {".env", ".env.local", ".env.production", "serviceaccountkey.json"}
                  or (filename.startswith("service-account") and filename.endswith(".json"))
              ):
                  disallowed.append(path)
          if disallowed:
              print("Generated artifacts or private config found in Git:", file=sys.stderr)
              print("\n".join(disallowed), file=sys.stderr)
              sys.exit(1)
          print("Repository hygiene check passed")
          PY
      - name: Compile backend sources
        run: python -m compileall -q backend
      - name: Run backend regressions and API smoke tests
        working-directory: backend
        env:
          CHRONOMIND_DISABLE_LEGACY_SCHEDULER: '1'
        run: python -m pytest -q


  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chronomind
          POSTGRES_USER: chronomind
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chronomind -d chronomind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://chronomind:local_ci_only@localhost:5432/chronomind
      LANGGRAPH_STRICT_MSGPACK: 'true'
      CHRONOMIND_DISABLE_LEGACY_SCHEDULER: '1'
      CHRONOMIND_LIVE_PG_TEST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Apply every PostgreSQL Alembic revision
        working-directory: backend
        run: python -m alembic -c alembic.ini upgrade head
      - name: Initialize durable graph checkpoint tables
        working-directory: backend
        run: python -m scripts.init_langgraph_checkpoints
      - name: Exercise approval transactions and checkpoint recovery on PostgreSQL
        working-directory: backend
        run: python -m pytest -q tests/test_v2_live_postgres.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run deterministic frontend regression tests
        working-directory: frontend
        env:
          TZ: Asia/Kolkata
        run: npm test
      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build
