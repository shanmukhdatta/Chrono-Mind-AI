services:
  - type: web
    name: chronomind-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GROQ_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_UID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CHRONOMIND_DISABLE_LEGACY_SCHEDULER
        value: '1'
      - key: LANGGRAPH_STRICT_MSGPACK
        value: 'true'
