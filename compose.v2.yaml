# Local development PostgreSQL only. Do not use these credentials in production.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chronomind
      POSTGRES_USER: chronomind
      POSTGRES_PASSWORD: chronomind_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - chronomind_v2_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronomind -d chronomind"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  chronomind_v2_pg:
